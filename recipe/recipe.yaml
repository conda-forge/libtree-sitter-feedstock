context:
  version: "0.27.2"

package:
  name: libtree-sitter
  version: ${{ version }}

source:
  url: https://github.com/tree-sitter/tree-sitter/archive/v${{ version }}.tar.gz
  sha256: 356528363bf7fbad12a2cfeb5a2678c0118ef886a4d69ad9a379db5fdef0735f

build:
  number: 0

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - if: win
      then:
        - cmake
        - ninja
      else:
        - make
  run_exports:
    - ${{ pin_subpackage('libtree-sitter', upper_bound='x.x') }}

tests:
  - if: unix
    then:
      - requirements:
          run:
            - ${{ stdlib("c") }}
            - ${{ compiler('c') }}
        script:
          - test -f ${PREFIX}/lib/libtree-sitter${SHLIB_EXT}
          - echo "int main() {}" | ${CC} -x c -L${PREFIX}/lib -ltree-sitter -

about:
  license: MIT
  license_file: LICENSE
  summary: Shared C library for tree-sitter
  homepage: https://tree-sitter.github.io/
  repository: https://github.com/tree-sitter/tree-sitter

extra:
  recipe-maintainers:
    - anjos
    - danielnachun
